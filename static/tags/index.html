<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Tags...</title>
  <script>
    var userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
    var destination = '/id/tags/'; // Default to Indonesian
    if (userLang === 'en') {
      destination = '/en/tags/';
    }
    window.location.replace(destination);
  </script>
  <meta http-equiv="refresh" content="0; url=/id/tags/">
</head>
<body>
  <p>Redirecting to <a href="/id/tags/">Tags page</a>...</p>
</body>
</html>

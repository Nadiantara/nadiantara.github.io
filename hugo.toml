baseURL = 'https://nadiantara.github.io/'
defaultContentLanguage = 'id'
defaultContentLanguageInSubdir = true
theme = 'limitsmatriks'
publishDir = "."
cleanDestinationDir = false

# Enable generating aliases for multilingual content
disableAliases = false

# Ensure we're generating robots.txt
enableRobotsTXT = true

[languages]
  [languages.id]
    languageName = 'Bahasa Indonesia'
    title = 'Limit & Matriks'
    weight = 1
    contentDir = 'content/id'
    [languages.id.params]
      description = "Mengeksplorasi topik-topik menarik dalam matematika dan sains"
      
    [languages.id.menu]
      [[languages.id.menu.main]]
        name = "Beranda"
        url = "/"
        weight = 1
      [[languages.id.menu.main]]
        name = "Tags"
        url = "/id/tags/"
        weight = 2

  [languages.en]
    languageName = 'English'
    title = 'Limits & Matrices'
    weight = 2
    contentDir = 'content/en'
    [languages.en.params]
      description = "Exploring fascinating topics in mathematics and science"
      
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 1
      [[languages.en.menu.main]]
        name = "Tags"
        url = "/en/tags/"
        weight = 2

[params]
  author = "Nadiantara"
  
  # Giscus Comments Configuration
  [params.giscus]
    enable = true
    repo = "nadiantara/nadiantara.github.io"
    repoId = "YOUR_REPO_ID"  # Get this from giscus.app
    category = "General"
    categoryId = "YOUR_CATEGORY_ID"  # Get this from giscus.app
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    loading = "lazy"
  
[taxonomies]
  tag = "tags"
  category = "categories"

# Make sure there's an explicit redirect for the English version
[outputFormats.REDIR]
mediatype = "text/html"
baseName = "redirect"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "REDIR"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        var userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
        var destination = '/id/'; // Default to Indonesian
        if (userLang === 'en') {
            destination = '/en/';
        }
        window.location.replace(destination);
    </script>
    <meta http-equiv="refresh" content="0; url=/id/">
</head>
<body>
    <p>Redirecting to <a href="/id/">Indonesian version</a>...</p>
</body>
</html>

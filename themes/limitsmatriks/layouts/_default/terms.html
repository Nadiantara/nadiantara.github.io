{{ define "main" }}
<header class="mb-4">
  <h1>{{ .Title }}</h1>
  <p class="lead">{{ i18n "browsePostsByTag" }}</p>
</header>

<div class="row">
  <div class="col-12">
    <ul class="list-group">
      {{ range .Data.Terms.Alphabetical }}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{{ .Page.Permalink }}">{{ .Page.Title }}</a>
        <span class="badge bg-primary rounded-pill">{{ .Count }}</span>
      </li>
      {{ end }}
    </ul>
  </div>
</div>

<hr class="mt-4">
<a href="{{ .Site.BaseURL }}">&larr; {{ i18n "backToHome" }}</a>
{{ end }}
